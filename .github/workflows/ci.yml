name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Mesa (software EGL and GLES for golden images)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri
      - run: cargo test --workspace
        env:
          SPHATIK_REQUIRE_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
      - name: Upload rendered images from failed golden tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-out
          path: target/golden-out/
          if-no-files-found: ignore

  cross:
    name: Cross-build (aarch64-unknown-linux-musl)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-musl
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: cargo zigbuild --workspace --release --target aarch64-unknown-linux-musl
      - name: Check the binaries are aarch64
        run: file target/aarch64-unknown-linux-musl/release/{sphatik-comp,sphatikd,sp}
      - uses: actions/upload-artifact@v4
        with:
          name: sphatik-aarch64-musl
          path: |
            target/aarch64-unknown-linux-musl/release/sphatik-comp
            target/aarch64-unknown-linux-musl/release/sphatikd
            target/aarch64-unknown-linux-musl/release/sp
          if-no-files-found: error
