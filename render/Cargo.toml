[package]
name = "sphatik-render"
description = "Sphatik OS GPU renderer: GLES 3 shapes, gradients, wallpapers and glass (ADR 0008)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
glow = "0.18.0"
lyon = "1.0.19"
# Pure-Rust glyph rasteriser for the lock-screen clock (interim; the Stage 4
# toolkit brings the full cosmic-text stack).
ab_glyph = "0.2"

[dev-dependencies]
khronos-egl = { version = "6.0.0", features = ["dynamic"] }
png = "0.18"
resvg = "0.48.1"
