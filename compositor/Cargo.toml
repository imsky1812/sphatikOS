[package]
name = "sphatik-comp"
description = "Sphatik OS Wayland compositor and glass renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# The real Linux compositor backend (Smithay winit + GLES + Wayland server).
# Off by default so the crate builds as a portable stub on Windows and in the
# aarch64 cross-build (ADR 0008); enabled on the Linux test job and the phone.
winit-backend = ["dep:smithay", "dep:png"]

# The phone compositor backend (WP 3.1): DRM/KMS + GBM + EGL + libinput, with
# a libseat session. Off by default and Linux-only (ADR 0008); compiled in CI,
# first run on the phone. Layers the DRM features onto the shared Smithay dep.
drm-backend = [
    "dep:smithay",
    "dep:png",
    "smithay/backend_drm",
    "smithay/backend_gbm",
    "smithay/backend_libinput",
    "smithay/backend_session_libseat",
    "smithay/backend_udev",
]

# Smithay is Linux-only (Wayland, EGL, libinput). Scoped to the Linux target so
# the dependency is never pulled in on Windows, and optional so it is compiled
# only when `winit-backend` is on.
[target.'cfg(target_os = "linux")'.dependencies]
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "backend_egl",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
], optional = true }
# Writing the composited frame to a PNG for the golden test (--shot mode).
png = { version = "0.18", optional = true }

# The compositing test (compositor/tests/wayland.rs) acts as a Wayland client
# against the compositor binary; these are Linux-only and used only by it.
[target.'cfg(target_os = "linux")'.dev-dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
tempfile = "3"
png = "0.18"

[lints]
workspace = true
